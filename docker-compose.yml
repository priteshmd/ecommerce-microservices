  services:
    users-db:
      image: postgres:16
      environment:
        POSTGRES_DB: users
        POSTGRES_USER: users
        POSTGRES_PASSWORD: users
      ports:
        - "5432:5432"
      volumes:
        - users-db-data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U users -d users" ]
        interval: 5s
        retries: 10

    users-service:
      build: ./users-service
      environment:
        DB_URL: jdbc:postgresql://users-db:5432/users
      ports:
        - "8081:8080"
      depends_on:
        users-db:
          condition: service_healthy

  volumes:
    users-db-data: