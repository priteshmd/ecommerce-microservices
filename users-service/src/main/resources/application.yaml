spring:
  application:
    name: users-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USER:users}
    password: ${DB_PASSWORD:users}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-to-at-least-32-chars-long}
  expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always